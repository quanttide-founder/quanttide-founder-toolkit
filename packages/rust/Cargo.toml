[package]
name = "quanttide-founder"
version = "0.1.0-alpha.2"
edition = "2024"
description = "量潮创始人工具箱（quanttide-founder-toolkit）的 Rust 包，面向创始人角色的事务与工具集合。"
license = "Apache-2.0"
repository = "https://github.com/quanttide-founder/quanttide-founder-toolkit"
readme = "README.md"
keywords = ["quanttide", "founder", "toolkit"]
categories = ["development-tools"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
quanttide-agent = "0.1.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
statig = "0.4"

[dev-dependencies]
tempfile = "3"

[lib]
name = "quanttide_founder"
path = "src/lib.rs"
